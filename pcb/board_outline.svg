<svg width="580" height="360" viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>brickdup_psu board outline — 38 x 18 mm</title>
  <desc>Rectangular PCB outline 38 mm by 18 mm with 2 mm rounded corners. Two M2 mounting holes (2.2 mm diameter) at diagonal corners: NW at (4,4) and SE at (34,14) board-local, keeping the centre clear for parts. J1 input wire connector (VBAT, GND) on the east short edge facing the LEMO; J2 output connector (5V, SENSE, GND) on the north long edge facing the Heltec. Scale 10 px per mm.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8a8a85; }
    .lbl { font-size: 11px; }
    .edge { stroke: #8a8a85; stroke-width: 2.5; fill: none; }
    .dim  { stroke: #4a8bc4; stroke-width: 1; fill: none; }
    .hole { stroke: #d85a30; stroke-width: 2; fill: none; }
    .pad  { fill: #d85a30; }
  </style>

  <!-- board: origin (60,90), 1mm=10px, 38x18mm => 380x180px -->
  <rect class="edge" x="60" y="90" width="380" height="180" rx="20"/>

  <!-- mounting holes at diagonal corners: NW (4,4)->(100,130), SE (34,14)->(400,230) -->
  <circle class="hole" cx="100" cy="130" r="11"/>
  <circle class="hole" cx="400" cy="230" r="11"/>
  <text x="100" y="118" text-anchor="middle" class="lbl">M2 (Ø2.2) NW (4,4)</text>
  <text x="400" y="252" text-anchor="middle" class="lbl">M2 (Ø2.2) SE (34,14)</text>

  <!-- J2 output (JST PH 3-pin) on the north long edge (toward Heltec) -->
  <circle class="pad" cx="170" cy="100" r="4"/>
  <circle class="pad" cx="190" cy="100" r="4"/>
  <circle class="pad" cx="210" cy="100" r="4"/>
  <text x="190" y="86" text-anchor="middle" class="lbl">J2 JST: 5V · SENSE · GND  ↑ to Heltec</text>

  <!-- J1 input (JST PH 2-pin) on the east short edge (toward LEMO) -->
  <circle class="pad" cx="430" cy="150" r="4"/>
  <circle class="pad" cx="430" cy="190" r="4"/>
  <text x="455" y="150" class="lbl">J1 JST: VBAT</text>
  <text x="455" y="194" class="lbl">GND  → from LEMO</text>

  <!-- width dimension 38mm -->
  <line class="dim" x1="60" y1="60" x2="440" y2="60"/>
  <line class="dim" x1="60" y1="54" x2="60" y2="66"/>
  <line class="dim" x1="440" y1="54" x2="440" y2="66"/>
  <text x="250" y="52" text-anchor="middle">38 mm</text>

  <!-- height dimension 18mm -->
  <line class="dim" x1="470" y1="90" x2="470" y2="270"/>
  <line class="dim" x1="464" y1="90" x2="476" y2="90"/>
  <line class="dim" x1="464" y1="270" x2="476" y2="270"/>
  <text x="490" y="184">18 mm</text>

  <text x="60" y="320" class="lbl">2-layer, 1.6 mm FR4, 1 oz Cu · 2 mm corner radius · all parts on top (F.Cu) · GND pour both sides</text>
  <text x="60" y="338" class="lbl">Holes at diagonal corners (NW + SE) keep the central band clear for the regulator + input.</text>
</svg>
