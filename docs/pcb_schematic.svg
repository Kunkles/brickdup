<svg width="940" height="560" viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>brickdup_psu — combined buck + divider PCB schematic</title>
  <desc>Raw battery enters at J1 (VBAT, GND). A TVS and input caps sit across the input. The MP9486A buck (U1) takes VBAT on VIN, switches SW into inductor L1 to the 5V output, with catch diode D1 from SW to ground, a bootstrap cap from BST to SW, output caps on 5V, and a feedback divider RFB1/RFB2 from 5V to FB to ground setting 5.0V. A separate sense divider R1/R2 with cap C1 from VBAT produces the SENSE node to GPIO7. J2 carries 5V, SENSE, and GND to the Heltec. EP and all grounds are common. Pin functions are shown; pin numbering must be taken from the official MP9486A symbol.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8a8a85; }
    .lbl { font-size: 11px; }
    .net { font-size: 11px; fill: #4a8bc4; font-weight: 600; }
    .wire { stroke: #8a8a85; stroke-width: 2; fill: none; }
    .plate { stroke: #8a8a85; stroke-width: 3; fill: none; }
    .box { stroke: #8a8a85; stroke-width: 2; fill: none; }
    .mcu { stroke: #4a8bc4; stroke-width: 2; fill: none; }
    .node { fill: #d85a30; }
    .pin { fill: #4a8bc4; font-size: 11px; }
  </style>

  <!-- ===== rails ===== -->
  <line class="wire" x1="110" y1="70" x2="860" y2="70"/>
  <text x="118" y="62" class="lbl">VBAT (≤25.2 V, 4S/6S)</text>
  <line class="wire" x1="40"  y1="510" x2="885" y2="510"/>
  <text x="44" y="528" class="lbl">GND — common: J1 −, buck GND + EP, D1 anode, R2/C1, RFB2, J2 GND</text>

  <!-- ===== J1 input ===== -->
  <rect class="box" x="40" y="45" width="70" height="70" rx="4"/>
  <text x="75" y="72" text-anchor="middle">J1</text>
  <text x="75" y="90" text-anchor="middle" class="lbl">LEMO in</text>
  <text x="75" y="103" text-anchor="middle" class="lbl">JST PH 2p</text>
  <line class="wire" x1="110" y1="70"  x2="110" y2="70"/>
  <line class="wire" x1="110" y1="100" x2="110" y2="510"/>
  <circle class="node" cx="110" cy="70" r="4"/>
  <circle class="node" cx="110" cy="510" r="4"/>

  <!-- ===== D2 TVS ===== -->
  <line class="wire" x1="175" y1="70" x2="175" y2="245"/>
  <line class="wire" x1="175" y1="305" x2="175" y2="510"/>
  <rect class="box" x="158" y="245" width="34" height="60" rx="4"/>
  <text x="200" y="280" class="lbl">D2 TVS</text>
  <text x="200" y="295" class="lbl">SMBJ45A</text>
  <circle class="node" cx="175" cy="70" r="4"/>
  <circle class="node" cx="175" cy="510" r="4"/>

  <!-- ===== Cin ===== -->
  <line class="wire" x1="245" y1="70"  x2="245" y2="118"/>
  <line class="plate" x1="231" y1="118" x2="259" y2="118"/>
  <line class="plate" x1="231" y1="130" x2="259" y2="130"/>
  <line class="wire" x1="245" y1="130" x2="245" y2="510"/>
  <text x="265" y="120" class="lbl">Cin</text>
  <text x="265" y="135" class="lbl">2×2.2µF/100V</text>
  <circle class="node" cx="245" cy="70" r="4"/>
  <circle class="node" cx="245" cy="510" r="4"/>

  <!-- ===== U1 MP9486A ===== -->
  <rect class="mcu" x="300" y="170" width="170" height="200" rx="5"/>
  <text x="385" y="160" text-anchor="middle">U1  MP9486A  (100V → 5V buck)</text>

  <!-- VIN -->
  <text x="308" y="209" class="pin">VIN</text>
  <line class="wire" x1="300" y1="205" x2="285" y2="205"/>
  <line class="wire" x1="285" y1="205" x2="285" y2="70"/>
  <circle class="node" cx="285" cy="70" r="4"/>
  <!-- EN -->
  <text x="308" y="254" class="pin">EN</text>
  <line class="wire" x1="300" y1="250" x2="265" y2="250"/>
  <line class="wire" x1="265" y1="250" x2="265" y2="150"/>
  <rect class="box" x="250" y="110" width="30" height="40" rx="3"/>
  <text x="246" y="134" text-anchor="end" class="lbl">REN1</text>
  <text x="246" y="148" text-anchor="end" class="lbl">100k</text>
  <line class="wire" x1="265" y1="110" x2="265" y2="70"/>
  <circle class="node" cx="265" cy="70" r="4"/>
  <!-- DIM -->
  <text x="308" y="324" class="pin">DIM</text>
  <line class="wire" x1="300" y1="320" x2="278" y2="320"/>
  <text x="274" y="324" text-anchor="end" class="lbl">tie per datasheet</text>
  <!-- GND / EP -->
  <text x="385" y="356" text-anchor="middle" class="pin">GND / EP</text>
  <line class="wire" x1="385" y1="370" x2="385" y2="510"/>
  <circle class="node" cx="385" cy="510" r="4"/>
  <!-- SW -->
  <text x="462" y="209" text-anchor="end" class="pin">SW</text>
  <line class="wire" x1="470" y1="205" x2="520" y2="205"/>
  <circle class="node" cx="520" cy="205" r="4"/>
  <!-- BST -->
  <text x="462" y="254" text-anchor="end" class="pin">BST</text>
  <line class="wire" x1="470" y1="250" x2="505" y2="250"/>
  <line class="wire" x1="505" y1="250" x2="505" y2="236"/>
  <line class="plate" x1="491" y1="236" x2="519" y2="236"/>
  <line class="plate" x1="491" y1="224" x2="519" y2="224"/>
  <line class="wire" x1="505" y1="224" x2="505" y2="205"/>
  <text x="525" y="244" class="lbl">Cbst 100nF</text>
  <!-- FB -->
  <text x="462" y="324" text-anchor="end" class="pin">FB</text>
  <line class="wire" x1="470" y1="320" x2="500" y2="320"/>
  <text x="505" y="324" class="net">FB</text>

  <!-- ===== L1 ===== -->
  <rect class="box" x="540" y="190" width="80" height="30" rx="4"/>
  <text x="580" y="209" text-anchor="middle" class="lbl">L1 33µH</text>
  <line class="wire" x1="620" y1="205" x2="660" y2="205"/>
  <circle class="node" cx="660" cy="205" r="4"/>

  <!-- ===== D1 catch diode (SW->GND, cathode up) ===== -->
  <line class="wire" x1="520" y1="205" x2="520" y2="250"/>
  <polygon class="box" points="506,290 534,290 520,262" />
  <line class="box" x1="506" y1="262" x2="534" y2="262"/>
  <line class="wire" x1="520" y1="290" x2="520" y2="510"/>
  <text x="540" y="282" class="lbl">D1 SS210</text>
  <text x="540" y="296" class="lbl">(≥100V Schottky)</text>
  <circle class="node" cx="520" cy="510" r="4"/>

  <!-- ===== Cout ===== -->
  <line class="wire" x1="660" y1="205" x2="660" y2="298"/>
  <line class="plate" x1="646" y1="298" x2="674" y2="298"/>
  <line class="plate" x1="646" y1="310" x2="674" y2="310"/>
  <line class="wire" x1="660" y1="310" x2="660" y2="510"/>
  <text x="600" y="300" text-anchor="end" class="lbl">Cout</text>
  <text x="600" y="315" text-anchor="end" class="lbl">2×22µF/25V</text>
  <circle class="node" cx="660" cy="510" r="4"/>

  <!-- ===== 5V rail to J2 ===== -->
  <line class="wire" x1="660" y1="205" x2="840" y2="205"/>
  <text x="690" y="197" class="net">5V</text>

  <!-- ===== FB divider (5V -> RFB1 -> FB -> RFB2 -> GND) ===== -->
  <line class="wire" x1="720" y1="205" x2="720" y2="248"/>
  <circle class="node" cx="720" cy="205" r="4"/>
  <rect class="box" x="705" y="248" width="30" height="40" rx="3"/>
  <text x="740" y="272" class="lbl">RFB1 240k</text>
  <line class="wire" x1="720" y1="288" x2="720" y2="300"/>
  <circle class="node" cx="720" cy="300" r="4"/>
  <text x="690" y="304" text-anchor="end" class="net">FB</text>
  <rect class="box" x="705" y="300" width="30" height="40" rx="3"/>
  <text x="740" y="328" class="lbl">RFB2 10k</text>
  <line class="wire" x1="720" y1="340" x2="720" y2="510"/>
  <circle class="node" cx="720" cy="510" r="4"/>

  <!-- ===== sense divider (VBAT -> R1 -> SENSE -> R2 -> GND, C1 parallel) ===== -->
  <line class="wire" x1="800" y1="70" x2="800" y2="110"/>
  <circle class="node" cx="800" cy="70" r="4"/>
  <rect class="box" x="785" y="110" width="30" height="40" rx="3"/>
  <text x="820" y="134" class="lbl">R1 200k</text>
  <line class="wire" x1="800" y1="150" x2="800" y2="205"/>
  <circle class="node" cx="800" cy="205" r="4"/>
  <text x="800" y="183" text-anchor="middle" class="net">SENSE</text>
  <!-- R2 -->
  <rect class="box" x="785" y="240" width="30" height="40" rx="3"/>
  <text x="820" y="264" class="lbl">R2 22k</text>
  <line class="wire" x1="800" y1="205" x2="800" y2="240"/>
  <line class="wire" x1="800" y1="280" x2="800" y2="510"/>
  <circle class="node" cx="800" cy="510" r="4"/>
  <!-- C1 parallel to R2 -->
  <line class="wire" x1="800" y1="205" x2="760" y2="205"/>
  <line class="wire" x1="760" y1="205" x2="760" y2="298"/>
  <line class="plate" x1="746" y1="298" x2="774" y2="298"/>
  <line class="plate" x1="746" y1="310" x2="774" y2="310"/>
  <line class="wire" x1="760" y1="310" x2="760" y2="510"/>
  <text x="742" y="300" text-anchor="end" class="lbl">C1</text>
  <text x="742" y="315" text-anchor="end" class="lbl">100nF</text>
  <circle class="node" cx="760" cy="510" r="4"/>
  <!-- SENSE to J2 -->
  <line class="wire" x1="800" y1="205" x2="840" y2="205" stroke-dasharray="0"/>

  <!-- ===== J2 output to Heltec ===== -->
  <rect class="box" x="840" y="155" width="80" height="120" rx="4"/>
  <text x="880" y="148" text-anchor="middle">J2 → Heltec (JST PH 3p)</text>
  <!-- 5V -->
  <line class="wire" x1="835" y1="205" x2="835" y2="180"/>
  <line class="wire" x1="835" y1="180" x2="840" y2="180"/>
  <text x="848" y="184" class="net">5V</text>
  <!-- SENSE -->
  <line class="wire" x1="835" y1="205" x2="840" y2="205"/>
  <text x="848" y="209" class="net">SENSE → GPIO7</text>
  <!-- GND -->
  <line class="wire" x1="840" y1="250" x2="833" y2="250"/>
  <line class="wire" x1="833" y1="250" x2="833" y2="510"/>
  <text x="848" y="254" class="net">GND</text>
  <circle class="node" cx="833" cy="510" r="4"/>

  <!-- note -->
  <text x="44" y="548" class="lbl">Functional pins shown — take MP9486A pin NUMBERS from the official symbol and run ERC. FB ref = 0.2 V → RFB1/RFB2 = 240k/10k sets 5.0 V.</text>
</svg>
