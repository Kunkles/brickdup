name: Build firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach binaries to a release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HELTEC_URL: https://resource.heltec.cn/download/package_heltec_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 / Heltec core
        run: |
          arduino-cli core update-index --additional-urls "$HELTEC_URL"
          arduino-cli core install Heltec-esp32:esp32 --additional-urls "$HELTEC_URL"

      - name: Install libraries
        run: |
          arduino-cli lib install "RadioLib"
          arduino-cli lib install "Heltec ESP32 Dev-Boards"
          arduino-cli lib install "heltec-eink-modules"

      - name: Compile (nodes = V3, receiver = Wireless Paper)
        run: |
          arduino-cli compile -b Heltec-esp32:esp32:heltec_wifi_lora_32_V3 --output-dir out/universal sensor_universal_heltec_v3
          arduino-cli compile -b Heltec-esp32:esp32:heltec_wifi_lora_32_V3 --output-dir out/onboard   sensor_onboard_heltec_v3
          arduino-cli compile -b Heltec-esp32:esp32:heltec_wifi_lora_32_V3 --output-dir out/block     sensor_block_heltec_v3
          arduino-cli compile -b Heltec-esp32:esp32:heltec_wireless_paper  --output-dir out/receiver  receiver_wireless_paper_v1_2

      - name: Collect .bin files (app images, for OTA)
        run: |
          mkdir -p firmware
          cp out/universal/sensor_universal_heltec_v3.ino.bin firmware/brickdup_universal.bin
          cp out/onboard/sensor_onboard_heltec_v3.ino.bin     firmware/brickdup_onboard.bin
          cp out/block/sensor_block_heltec_v3.ino.bin         firmware/brickdup_block.bin
          cp out/receiver/receiver_wireless_paper_v1_2.ino.bin firmware/brickdup_receiver.bin
          ls -la firmware

      - name: Upload build artifacts (every push)
        uses: actions/upload-artifact@v4
        with:
          name: brickdup-firmware
          path: firmware/*.bin

      - name: Publish release (on v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/*.bin
